[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmusic-mcp"
version = "0.2.0"
description = "MCP server for managing YouTube Music playlists from Claude and other MCP clients."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.29,<2",
    "ytmusicapi>=1.12,<2",
    "cryptography>=44",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ytmusic-mcp = "ytmusic_mcp.app:main"
ytmusic-mcp-admin = "ytmusic_mcp.cli:main"

[tool.setuptools]
packages = ["ytmusic_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["youtube_integration: mutates the configured real YouTube Music account"]

[tool.ruff]
line-length = 110
