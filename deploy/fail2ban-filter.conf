# Install as /etc/fail2ban/filter.d/ytmusic-mcp.conf
#
# Matches failed password attempts (wrong password, lockout, expired request).
# Plain 401/404 responses elsewhere are deliberately NOT matched: OAuth clients
# legitimately get them (a 401 starts every token refresh, and clients probe
# discovery URLs), so banning them could lock out your own connector.

[Definition]
failregex = ^<HOST> .* "POST /login/callback[^"]*" (400|401|429) .*$
ignoreregex =
