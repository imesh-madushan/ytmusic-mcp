# /etc/nginx/sites-available/ytmusic-mcp
#
# Public-facing side: ONLY port 443 (HTTPS) is exposed, and the only path
# served is /ytmusic-mcp plus its OAuth endpoints. Everything else 404s.
# Port 80 exists solely to redirect
# to HTTPS and to let certbot renew the certificate.
#
# The actual server process (server.py) binds to 127.0.0.1:8787 only —
# it is never reachable directly from the internet, only through this proxy.

limit_req_zone $binary_remote_addr zone=mcp_limit:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.yourdomain.com;

    # Needed for certbot's HTTP-01 challenge during renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.yourdomain.com;

    # Filled in automatically by: certbot --nginx -d mcp.yourdomain.com
    ssl_certificate     /etc/letsencrypt/live/mcp.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Public MCP resource; the application serves it internally at /mcp.
    location = /ytmusic-mcp {
		proxy_pass http://127.0.0.1:8787/mcp;
		proxy_http_version 1.1;

		proxy_set_header Host 127.0.0.1:8787;

		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 3600s;
		proxy_set_header Connection "";
	}

    # OAuth discovery, registration, authorization, tokens, and login.
    location = /.well-known/oauth-protected-resource/ytmusic-mcp { proxy_pass http://127.0.0.1:8787; }
    location = /.well-known/oauth-authorization-server { proxy_pass http://127.0.0.1:8787; }
    location = /register { proxy_pass http://127.0.0.1:8787; }
    location = /authorize { proxy_pass http://127.0.0.1:8787; }
    location = /token { proxy_pass http://127.0.0.1:8787; }
    location = /revoke { proxy_pass http://127.0.0.1:8787; }
    location = /login { proxy_pass http://127.0.0.1:8787; }
    location = /login/callback {
        limit_req zone=mcp_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
    }

    # Everything else: no route, no response, no hint the app exists.
    location / {
        return 404;
    }

    access_log /var/log/nginx/ytmusic-mcp.access.log;
    error_log  /var/log/nginx/ytmusic-mcp.error.log;
}
